--fasta-search
--predictor
--cut K*,R*,!*P
--missed-cleavages 1
--met-excision
--min-pep-len 7
--max-pep-len 30
--min-pr-charge 1
--max-pr-charge 4
--min-pr-mz 300
--max-pr-mz 1800
--min-fr-mz 200
--max-fr-mz 1800
--unimod4
--var-mods 0
--qvalue 0.01
--matrix-qvalue 0.01
--reanalyse
# Fixed mass tolerances (DIA-NN's own timsTOF recommendation, 10-15 ppm).
# DO NOT use auto (--mass-acc 0): on the ultra-clean simulated m/z, DIA-NN's
# auto-calibration collapses to a window where targets cannot beat decoys and
# returns 0 IDs at 1% FDR. Fixing to 15 ppm -> ~27k precursors. See NOTES.md.
--mass-acc 15
--mass-acc-ms1 15
