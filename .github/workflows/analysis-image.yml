name: Publish PlasmaBENCH analysis image

# Slim CPU image for the EVIDENT analysis-replay surface (scorer + plots). Code is
# baked in (pinned to this commit); raw data is mounted externally at run time.
# Separate from the timsim (GPU) image; needs no submodules, so checkout is fast.

on:
  push:
    branches: [main]
    paths:
      - 'docker/analysis.Dockerfile'
      - 'plasmabench/**'
      - 'scripts/**'
      - 'configs/**'
      - 'Makefile'
      - '.github/workflows/analysis-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: thegreatherrlebert/plasmabench-analysis

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # analysis image copies only plasmabench/scripts/configs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/analysis.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=PlasmaBENCH analysis replay

      - name: Echo digest
        run: echo "analysis image digest: ${{ steps.build.outputs.digest }}"
