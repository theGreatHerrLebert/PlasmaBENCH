name: Publish PlasmaBENCH timsim image

# Build the rustims Dockerfile from the pinned `rustims/` submodule and push to
# GHCR under our own namespace. This insulates stage 1 from upstream
# rustims:latest lagging behind the from_findings branch — PlasmaBENCH owns the
# image lifecycle.

on:
  push:
    branches: [main]
    paths:
      - 'rustims'
      - '.github/workflows/docker-publish.yml'
      - 'docker/**'
  workflow_dispatch:
    inputs:
      tag_extra:
        description: 'Optional extra tag (e.g. release tag) to attach to this build'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: thegreatherrlebert/plasmabench-timsim

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # The image compiles rustims (polars, etc.) via maturin — the default
      # ~14 GB free on ubuntu-latest runs out ("No space left on device").
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Do NOT recurse all submodules: evident's nested submodule
          # (evident/cases/cu-ims-primitives) is private/missing and aborts checkout.
          # The image build only needs rustims, which we init explicitly below.
          submodules: false

      - name: Init rustims submodule (only)
        run: git submodule update --init --recursive rustims

      - name: Resolve rustims SHA
        id: rustims
        run: |
          cd rustims
          full=$(git rev-parse HEAD)
          short=$(git rev-parse --short=12 HEAD)
          echo "sha=$full" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "rustims pinned at: $full"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          base="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags="${base}:latest,${base}:from-findings,${base}:rustims-${{ steps.rustims.outputs.short }}"
          if [[ -n "${{ github.event.inputs.tag_extra }}" ]]; then
            tags="${tags},${base}:${{ github.event.inputs.tag_extra }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./rustims
          file: ./rustims/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=PlasmaBENCH timsim runtime
            org.opencontainers.image.description=Pinned-rustims build for PlasmaBENCH stage 1 (from_findings mode)
            plasmabench.rustims.sha=${{ steps.rustims.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Echo digest for Makefile pin
        run: |
          echo "Pushed image digest: ${{ steps.build.outputs.digest }}"
          echo "Pin in Makefile as:"
          echo "  IMAGE_DIGEST := ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
