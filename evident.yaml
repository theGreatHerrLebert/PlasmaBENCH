version: 0.1
project: plasmabench
# PlasmaBENCH EVIDENT manifest
#
# Validate:  python evident/workflow/validate_manifest.py evident.yaml
# Claim statements follow the PR #46 discipline (precise, fully-scoped); the
# claim.statement/as_stated block is not yet in the validator, so the exact
# statement lives in the string `claim:` and the source anchor is a YAML comment
# (# as_stated: report §N) until the 0.3 schema lands.

vocabularies:
  subsystem:
    - ratio-recovery        # A/B spike-in ratio accuracy/recovery
    - fdr-recall            # empirical FDR + recall vs blueprint
    - quant-precision       # cross-sample ratio dispersion / quant method
    - real-vs-sim           # simulation validated against real experimental data
    - simulator-fidelity    # where/why the simulator diverges from reality
  oracle:
    - timsim-blueprint      # exact per-precursor ground truth emitted by TimSim
    - pye1-nominal-ratios   # designed PYE1 spike-in ratios (human 1.0, yeast 3.0, ecoli 0.5)
    - diann-1.8
    - diann-2.5
    - diann-2.6
    - real-g-pye1           # Ute's real experimental G PYE1 runs (G250506)
    - rustims-renderer      # the rustims TimSim signal-rendering source
  input_class:
    - experimental          # real acquired data (extends the base synthetic/fixture set)

claims:
  - id: plasmabench-stage1-simulated-truth
    title: Stage 1 DIA software comparison is validated against TimSim synthetic truth
    subsystem: fdr-recall
    case: cases/plasmabench-stage1.md
    source: cases/plasmabench-stage1
    tier: research
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#simulation-based-validation
    # as_stated: report §2-§6 / docs/claims-audit.md
    claim: >
      Stage-1 search-engine metrics for the all-species PYE1 SIM (noise sampled from
      a real blank) — species-resolved peptide/precursor recall, species-resolved true
      FDR, and B/A ratio recovery — are scored against the TimSim per-sample blueprints
      emitted alongside the simulated Sample A and B DIA runs, with per-metric
      tolerances declared before each release. Ratios are quantified from raw precursor
      intensity; protein FDR is group-credit; ambiguous-species peptides are excluded.
    inputs:
      corpus: pye1-stage1-sim
      n: 2
      class: synthetic
    pinned_versions:
      plasmabench: "3b2acdd"
      timsim-blueprint: "rustims-2748248"
      pye1-nominal-ratios: "PYE1-v1"
    tolerances:
      - metric: absolute_error
        op: "<="
        value: 0.4
        prose: Decision rule (scripts/stage1_eval.py) — every engine's yeast & E.coli A/B (human-anchored, ion AND protein level) recovers nominal within 0.4 log2; ratios use both-sample features only (singletons excluded). FDR/recall reported as cross-engine differences, not absolute pass/fail.
    evidence:
      oracle:
        - timsim-blueprint
        - pye1-nominal-ratios
      command: make stage1-eval
      artifact: results/stage1/metrics.json
    assumptions:
      - TimSim reproduces the TimsTOF DIA-PASEF behaviour relevant to the scored metrics; plasma matrix effects beyond the injected noise are out of scope for stage 1.
      - The Sample A / Sample B reports used to seed the simulation are representative enough that differential search-engine behaviour is visible.
      - Organism assignment (HUMAN / YEAST / ECOLI) is unambiguous for scored peptides; shared/ambiguous peptides are excluded from the ratio oracle.
    failure_modes:
      - Seed-engine circularity — seeding from one engine's report and scoring that same engine inflates self-recall. Score each engine against the union blueprint; read cross-engine differences.
      - Simulator overfit — pipelines tuned on synthetic data may improve stage-1 metrics without improving real-data behaviour. Stage 2 and the experimental runs must be inspected.
      - Validation theater — sweeps without a pre-declared decision rule produce volume, not signal.
      - Convention gaps between tools (FDR, mass tolerance, modifications) misattribute disagreement to method rather than configuration; document untunable parameters in configs/<tool>/NOTES.md.
      - Ratio leakage — a misassigned peptide pollutes two species' ratio distributions at once; audit the species map before scoring.

  - id: plasmabench-stage2-superimpose-truth
    title: Stage 2 spike-in ratios on real plasma recover nominal against TimSim truth
    subsystem: ratio-recovery
    case: docs/claims-audit.md
    source: simulations/stage2
    tier: research
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#simulation-based-validation
    # as_stated: report §7 / docs/finding-ratio-distortion.md
    claim: >
      For the PYE1 yeast+E.coli spike-in simulated by TimSim from_findings and
      superimposed on a real PYE plasma .d (human = real background, no blueprint),
      the recovered A/B ratios match the TimSim blueprint at nominal — yeast B/A ≈ 3.0,
      E. coli B/A ≈ 0.5 — at protein and ion level on raw Precursor.Quantity, on both
      reference-plasma backgrounds (r080, r081), AFTER correcting the from_findings
      per-sample-median normalization that had scaled every cross-sample ratio by
      median(A)/median(B) ≈ 0.7 (fixed upstream via rustims PR #407, shared
      reference_median; sim-QC confirms blueprint B/A back to nominal). Human carries
      no blueprint truth, so FDR/recall are scored over the simulated spike-in only.
    inputs:
      corpus: pye1-stage2-sim
      n: 4
      class: synthetic
    pinned_versions:
      plasmabench: "3b2acdd"
      timsim-blueprint: "rustims-2748248"
      pye1-nominal-ratios: "PYE1-v1"
    tolerances:
      - metric: relative_error
        op: "<"
        value: 0.05
        prose: Blueprint B/A within ~5% of nominal (yeast 3.0, E. coli 0.5) — the sim-QC gate after the from_findings fix.
    evidence:
      oracle:
        - timsim-blueprint
        - pye1-nominal-ratios
      command: python scripts/plot_stage1_ratios.py --report <stage2 report> --protein-quant raw_sum
      artifact: results/figures/stage2fix_18_ratios_protein.png
    assumptions:
      - The native findings_reference_median (interim per-sample intensity_multiplier) cancels the per-sample-median distortion; sim-QC blueprint A/B ≈ nominal is the gate.
      - Superimposing simulated signal onto a real .d does not reproduce ion suppression / fill-time / detector saturation — it tests the dense-background + DIA-NN-processing contribution only.
    failure_modes:
      - Scoring against nominal instead of the (possibly distorted) blueprint masks a simulator contract violation; report both nominal recovery and sim-QC of the blueprint itself.
      - Same-background A/B pairing gives a perfect human anchor but may amplify ratio distortion vs real separate injections.

  - id: plasmabench-diann-crossrun-normalization
    title: DIA-NN 2.5/2.6 cross-run normalization inflates A/B ratio spread; raw recovers it
    subsystem: quant-precision
    case: docs/finding-diann-1.8-vs-2.5-quant.md
    source: plasmabench/plots
    tier: research
    trust_strategy:
      - validation
      - understanding
    pattern: evident/patterns/README.md#cross-tool-agreement
    # as_stated: report §8
    claim: >
      On the PYE1 A/B spike-in (SIM and real), DIA-NN 2.5 and 2.6's cross-run
      normalization — the Precursor.Normalised column, and PG.MaxLFQ which is built on
      it — inflates per-precursor log2(A/B) ratio dispersion (IQR) by roughly 2× (blank
      Stage 1) to ~9× (real-plasma Stage 2) relative to DIA-NN 1.8, and reading raw
      Precursor.Quantity (or Ms1.Area) instead recovers 1.8-level precision. The
      inflation lives in the normalization step, not the MaxLFQ protein rollup (the
      endpoint is precursor-level) nor the QuantUMS peak extraction (both raw columns
      are fine, both .Normalised columns are bad), and it persists on the
      shared-precursor intersection and the common-column feature set — so it is not a
      coverage or anchoring artifact. DIA-NN 2.6 did not fix it; the benchmark
      quantifies from raw precursor intensity throughout.
    inputs:
      corpus: pye1-ab-spikein
      n: 3
      class: synthetic
    pinned_versions:
      plasmabench: "3b2acdd"
      timsim-blueprint: "rustims-2748248"
      diann-1.8: "1.8.1"
      diann-2.5: "2.5.0"
      diann-2.6: "2.6.0"
    tolerances:
      - prose: Per-species ratio IQR (raw vs .Normalised) and residual-vs-truth (bias + spread) reported; the control is shared-precursor + common-column invariance of the IQR gap.
    evidence:
      oracle:
        - timsim-blueprint
        - diann-1.8
        - diann-2.5
        - diann-2.6
      command: python scripts/diag_quant_method.py --report <report>
      artifact: results/figures/quant_18v25_normalization.png
    assumptions:
      - The unified diann-pye1.cfg differs across versions only in the binary, so a 1.8/2.5/2.6 difference at fixed raw quantity is an engine property.
      - Precursor.Normalised is a strictly-positive rescale of Precursor.Quantity (identical support), so the comparison is on the same precursors.
    failure_modes:
      - Comparing engines on .Normalised (the out-of-the-box default) is benign for 1.8 but penalizes 2.x; the apples-to-apples basis is raw quantity for all engines.
      - IQR is precision-only; report residual-vs-truth so a tightly-but-wrongly-centered engine cannot hide.

  - id: plasmabench-real-vs-sim-validation
    title: TimSim PYE1 is validated against real experimental data except a low-input gap
    subsystem: real-vs-sim
    case: docs/claims-audit.md
    source: plasmabench/plots
    tier: research
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#layered-evaluation-against-simulated-and-real-references
    # as_stated: report §9 / docs/timsim-lowinput-noise-floor.md
    claim: >
      Searched with the identical unified config (only the DIA-NN binary differs),
      TimSim-simulated PYE1 reproduces the real experimental G PYE1 A/B ratio behaviour
      at moderate-to-high abundance and the cross-version differences — our unified
      2.5/2.6 reproduce the real-data global ratios (E. coli +0.89–0.90, yeast
      −1.32–1.33 in log2 A/B) and the ~23–25% precursor-yield gain of 2.x over 1.8 —
      EXCEPT at low abundance, where the simulation spuriously OVER-separates the
      spike-in fold change (E. coli ≈ +1.4–1.8, yeast ≈ −2.3–2.4 in the lowest
      reported-abundance octile) while matched single-A-vs-single-B real data stays
      flat (≈ +0.95 / −1.40 at every octile). The divergence is engine-independent and
      on both blank and real-plasma backgrounds; human is the flat negative control.
      Promotion rule: the simulated track is validated for ratio recovery at
      moderate-to-high abundance; the low-abundance regime is held at experimental (not
      validated) pending the simulator fix.
    inputs:
      corpus: g-pye1-real-vs-sim
      n: 12
      class: experimental
    pinned_versions:
      plasmabench: "3b2acdd"
      real-g-pye1: "G250506"
      pye1-nominal-ratios: "PYE1-v1"
      diann-1.8: "1.8.1"
    tolerances:
      - prose: Per-species ratio-vs-abundance shape compared real (matched 1-vs-1) vs SIM on raw quantity, human-anchored; the negative control (human) is flat in both.
    evidence:
      oracle:
        - real-g-pye1
        - pye1-nominal-ratios
        - diann-1.8
      command: python scripts/plot_real_vs_sim_compression.py
      artifact: results/figures/real_vs_sim_compression.png
    assumptions:
      - Real and SIM must be compared at matched replicate structure (1-vs-1); averaging the 6 real replicates manufactures apparent low-abundance compression (a confound corrected after Codex review).
      - The reported-abundance octile is a within-dataset rank, not a matched absolute input across datasets with different intensity scales.
    failure_modes:
      - Replicate-count asymmetry (6×6 real vs 1×1 SIM) can manufacture an abundance-dependent ratio trend; match the structure.
      - Complete-case selection near the detection limit can bias low-octile ratios; controlled here only by the same-pipeline real-vs-SIM comparison.

  - id: plasmabench-lowinput-overseparation
    title: SIM low-input over-separation is sub-1.0 ion-count collapse (fix proposed, unverified)
    subsystem: simulator-fidelity
    case: docs/timsim-lowinput-noise-floor.md
    source: rustims/rustdf/src/sim
    tier: research
    trust_strategy:
      - validation
      - understanding
    pattern: evident/patterns/README.md#layered-evaluation-against-simulated-and-real-references
    # as_stated: report §9a / docs/timsim-lowinput-noise-floor.md
    claim: >
      The TimSim low-abundance ratio over-separation is caused by under-quantification
      of the LOWER-intensity member of each A/B pair: decomposing into per-member quant
      recovery log2(observed/truth) vs TRUE (blueprint) abundance, the higher member is
      recovered accurately at all abundances while the lower member is under-quantified
      at low abundance, and the higher-minus-lower gap equals the over-separation to the
      decimal and is member-symmetric. The mechanism (read from the rustims rendering
      path, Codex-reviewed) is deterministic: integer event truncation with a 1-event
      floor (load_findings), deterministic multidimensional dilution, and a hard < 1.0
      per-pixel intensity threshold + rounding (precursor.rs/dia.rs) with no count
      sampling — so the dimmer member loses proportionally more sub-unit contributions.
      Real-data noise is injected AFTER that threshold (assemble_frames) and cannot
      restore the erased signal, which is why adding real-data noise did not help. A fix
      — a per-pixel count model before the 1.0 filter, for DIA MS2 — is PROPOSED but NOT
      YET VERIFIED (no after-fix simulation scored against this target).
    inputs:
      corpus: pye1-stage2-sim
      n: 4
      class: synthetic
    pinned_versions:
      plasmabench: "3b2acdd"
      timsim-blueprint: "rustims-2748248"
      rustims-renderer: "rustims-2748248"
    tolerances:
      - prose: Per-member quant-recovery vs true-abundance octile; the higher-minus-lower recovery gap reproduces the measured over-separation per species.
    evidence:
      oracle:
        - timsim-blueprint
        - rustims-renderer
      command: python scripts/plot_lowabund_underquant.py
      artifact: results/figures/sim_lowabund_underquant.png
    assumptions:
      - The diagnosis localises the cause to TimSim rendering + DIA-NN quant of low-count synthetic peaks; it does not separate rendering from quant beyond what truth-vs-observed shows.
    failure_modes:
      - ABSENT (looked for, not yet produced) — after-fix evidence is an after-fix SIM re-run scored against the same per-member-recovery target. Until it exists, the fix is proposed, not validated.
      - The fix must land in the Rust renderer before the 1.0 filter; adding events in load_findings would corrupt blueprint truth, and a constant on the EMG abundance is renormalized away.
