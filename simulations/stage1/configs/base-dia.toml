# =============================================================================
# PlasmaBENCH Stage 1 — base DIA config (from_findings)
#
# Rendered per sample (A / B) by scripts/render_configs.py, which fills in
# findings_path, save_path and experiment_name. SAMPLE_PLACEHOLDER is
# substituted with the sample label.
#
# Schema is the new from_findings layout (rustims feature/simulate-from-findings).
# The [digestion] block is intentionally absent: under from_findings TimSim reads
# peptides from the seed CSV instead of digesting a FASTA.
#
# IMPORTANT — no proteome_mix here. The PYE1 A/B spike-in ratios live in the
# seed CSV's intensities and organism membership (they came from the real
# Sample A / Sample B reports). [proteome_mix] is for the *fully synthetic*
# FASTA-digestion route and must stay false on this path.
#
# Values marked TODO must be matched to Ute's acquisition method once known.
# =============================================================================

[paths]
save_path       = "/work/simulations/stage1/dia/sampleSAMPLE_PLACEHOLDER"
# TODO(Ute): real TimsTOF DIA-PASEF blank acquired with the study method.
reference_path  = "/data/raw/dia/blanks/BLANK_PLACEHOLDER.d"
# Ignored under from_findings, but keep a valid plasma+yeast+ecoli FASTA here
# so other tooling resolves. TODO(Ute): study FASTA (human plasma + YEAST + ECOLI).
fasta_path      = "/data/raw/fasta/plasma_yeast_ecoli.fasta"
findings_path   = "/work/simulations/stage1/seeds/seed_sampleSAMPLE_PLACEHOLDER.csv"
modifications   = "/work/simulations/stage1/configs/modifications.toml"
existing_path   = ""

[experiment]
experiment_name      = "PLB-S1-DIA-sampleSAMPLE_PLACEHOLDER"
acquisition_type     = "DIA"
gradient_length      = 3600.0          # TODO(Ute): match the study DIA gradient (s)
use_reference_layout = true
reference_in_memory  = false
use_bruker_sdk       = true
apply_fragmentation  = true
from_existing        = false
from_findings        = true
silent_mode          = false

[models]
rt_model        = ""
ccs_model       = ""
intensity_model = ""

[retention_time]
min_rt_percent                     = 2.0
exclude_accumulated_gradient_start = true
target_p                           = 0.999
sampling_step_size                 = 0.0001
n_steps                            = 1000
remove_epsilon                     = 0.0001

[ion_mobility]
use_inverse_mobility_std_mean = true
inverse_mobility_std_mean     = 0.009

[charge_states]
p_charge                     = 0.5
max_charge                   = 4
min_charge_contrib           = 0.25
binomial_charge_model        = true
normalize_charge_states      = true
charge_state_one_probability = 0.0

[isotopic_pattern]
isotope_k             = 8
isotope_min_intensity = 1
isotope_centroid      = true

[fragment_intensity]
down_sample_factor = 0.5

[noise]
# Inject noise from random frames of the real blank (reference_path). For
# stage 2 (overlay onto a real plasma .d) set superimpose_on_reference = true
# instead — it adds the simulated signal on top of the reference frames rather
# than sampling noise from them. The two are mutually exclusive.
noise_frame_abundance         = false
noise_scan_abundance          = false
mz_noise_precursor            = true
precursor_noise_ppm           = 6.5
mz_noise_fragment             = true
fragment_noise_ppm            = 6.5
mz_noise_uniform              = false
add_real_data_noise           = true
# superimpose_on_reference    = false   # stage 2: overlay on a real plasma .d
reference_noise_intensity_max = 150000
precursor_sample_fraction     = 0.2
fragment_sample_fraction      = 0.2
num_precursor_noise_frames    = 5
num_fragment_noise_frames     = 5

[variation]
re_scale_rt                = false
rt_variation_std           = 10
ion_mobility_variation_std = 0.01
intensity_variation_std    = 0.02

[acquisition]
round_collision_energy    = true
collision_energy_decimals = 0

# Ratios are baked into the seed — DO NOT enable proteome_mix on this path.
[proteome_mix]
proteome_mix = false

[phosphorylation]
phospho_mode = false

[performance]
num_threads          = -1
batch_size           = 256
frame_batch_size     = 500
lazy_frame_assembly  = false
use_gpu              = false
gpu_memory_limit_gb  = 4

[logging]
log_level = "INFO"
log_file  = ""

[video_settings]
generate_preview_video = false
